name: Build and test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: workout_tests
          POSTGRES_USER: workout_test
          POSTGRES_PASSWORD: local-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workout_test -d workout_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKOUT_TEST_POSTGRES: Host=localhost;Port=5432;Database=workout_tests;Username=workout_test;Password=local-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment orchestration
        run: bash scripts/test-deploy-unraid.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet test backend/Workout.Tests -c Release
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker build -t workout-ci .

  deploy:
    name: Deploy to Unraid
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, workout-deploy]
    timeout-minutes: 30
    concurrency:
      group: workout-production
      cancel-in-progress: false
    env:
      WORKOUT_DEPLOY_PATH: /mnt/user/appdata/workout/source
      PUBLIC_HOSTNAME: workout.swaenepoel.org
      PublicOrigin: https://workout.swaenepoel.org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, migrate, and restart Workout
        run: bash scripts/deploy-unraid.sh
