name: workout-tests
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: workout_tests
      POSTGRES_USER: workout_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout_test -d workout_tests"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
